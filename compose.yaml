services:
  submanager:
    image: "${SUBMANAGER_IMAGE:-ghcr.io/irixos/submanager:latest}"
    # Remove or comment out the ports section when enabling Caddy below so the app is only reachable through the proxy.
    ports:
      - "${SUBMANAGER_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ASPNETCORE_HTTP_PORTS: "8080"
      # Enable this only when Caddy is enabled and the direct port mapping above is removed.
      # ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${SQLSERVER_DATABASE:-SubManager};User ID=sa;Password=${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
      Smtp__Host: "${SUBMANAGER_SMTP_HOST:-}"
      Smtp__Username: "${SUBMANAGER_SMTP_USERNAME:-}"
      Smtp__Password: "${SUBMANAGER_SMTP_PASSWORD:-}"
      Smtp__Port: "${SUBMANAGER_SMTP_PORT:-587}"
      Smtp__FromAddress: "${SUBMANAGER_SMTP_FROM_ADDRESS:-}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    image: "${SUBMANAGER_IMAGE:-ghcr.io/irixos/submanager:latest}"
    entrypoint: ["./efbundle"]
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${SQLSERVER_DATABASE:-SubManager};User ID=sa;Password=${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "${SQLSERVER_EDITION:-Express}"
      MSSQL_SA_PASSWORD: "${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD in .env}"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Optional HTTPS reverse proxy using Caddy.
  # Set SUBMANAGER_DOMAIN in .env, point its DNS records at this host, and open ports 80 and 443.
  # caddy:
  #   image: caddy:2-alpine
  #   command: ["caddy", "reverse-proxy", "--from", "${SUBMANAGER_DOMAIN:?Set SUBMANAGER_DOMAIN in .env}", "--to", "submanager:8080"]
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - caddy-data:/data
  #   depends_on:
  #     submanager:
  #       condition: service_started
  #   restart: unless-stopped

volumes:
  sqlserver-data:
  # caddy-data:
